name: Docs media

# Regenerates the README screenshots and GIF from the real extension running in
# a real Chromium, and commits them back. Pushes made with GITHUB_TOKEN do not
# trigger workflows, so this cannot loop.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'scripts/capture-docs.mjs'
      - 'scripts/e2e/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-media
  cancel-in-progress: false

jobs:
  capture:
    name: capture screenshots and GIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick ffmpeg xdotool

      - name: Allow ImageMagick to read and write PNG
        run: |
          # Some ImageMagick 6 policies block PNG/PS; relax only what capture needs.
          POLICY=/etc/ImageMagick-6/policy.xml
          if [ -f "$POLICY" ]; then
            sudo sed -i 's/rights="none" pattern="PNG"/rights="read|write" pattern="PNG"/' "$POLICY"
          fi

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Capture
        run: xvfb-run -a --server-args="-screen 0 1180x820x24" npm run capture:docs

      - name: Commit refreshed media
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs media unchanged"
            exit 0
          fi
          git commit -m "docs: refresh screenshots and demo GIF from the real build"
          git push
